[package]
name = "media-studio-pro"
version = "0.1.0"
description = "Media Studio Pro — media library, review and editing"
authors = ["Media Studio Pro"]
edition = "2024"

[lib]
name = "media_studio_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
imagesize = "0.14"
kamadak-exif = "0.6"
trash = "5"
thiserror = "2"
fs4 = "0.13"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
